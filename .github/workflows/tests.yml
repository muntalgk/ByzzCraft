name: tests

# run by ci.yml (pull requests, main, tags) before it builds the image and the Windows zip
on:
  workflow_call:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        shell: bash
        run: |
          status=0
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t" || status=1
          done
          exit $status
