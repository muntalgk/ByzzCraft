# ByzzCraft behind nginx with HTTPS. Put it in /etc/nginx/sites-available/byzzcraft, link it into
# sites-enabled, get a certificate with `sudo certbot --nginx -d panel.example.com`, then `sudo nginx -s reload`.
# nginx must run on the same machine as the panel: the panel trusts proxy headers only from 127.0.0.1.
server {
    listen 80;
    server_name panel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        # replace, do not append: a client must not be able to choose its own address (login rate limit)
        proxy_set_header X-Forwarded-For $remote_addr;
        # tells the panel the browser uses HTTPS, so the login cookie is marked Secure
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # live updates use server-sent events: no buffering, long-lived connection
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
